# Локальная инфраструктура разработки (docs/03 §7)
# Запуск: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: uwt
      POSTGRES_PASSWORD: uwt
      POSTGRES_DB: uwt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # объектное хранилище статического data-контракта (в проде — S3/R2 + CDN)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: uwt
      MINIO_ROOT_PASSWORD: uwt-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
